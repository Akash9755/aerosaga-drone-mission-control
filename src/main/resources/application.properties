spring.application.name=aerosaga
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/aerosaga?options=-c%20TimeZone%3DUTC
spring.datasource.username=postgres
spring.datasource.password=infotact1ntern@1

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# API Key Security
aerosaga.security.api-key=${AEROSAGA_API_KEY:dev-local-key-change-me}