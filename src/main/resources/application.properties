spring.application.name=AeroSaga

# Postgres connection
spring.datasource.url=jdbc:postgresql://localhost:5432/aerosaga
spring.datasource.username=postgres
spring.datasource.password=0101
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Schema is now owned by Flyway migrations (see src/main/resources/db/migration).
# "validate" makes Hibernate check the schema matches the entities instead of
# silently altering tables - safer once migrations are in place.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.port=8080

logging.level.com.example.aerosaga=DEBUG

# --- Actuator: health checks and metrics ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# --- API key security ---
# Every non-exempt request must send header: X-API-KEY: <this value>
# Override in production via an environment variable instead of hardcoding.
aerosaga.security.api-key=${AEROSAGA_API_KEY:dev-local-key-change-me}

# --- Configurable mission-failure simulation ---
# Global random chance (0.0 - 1.0) that any package drop randomly fails,
# independent of a mission's own forceDropFailure flag. Defaults to 0 (off).
aerosaga.mission.random-failure-rate=0.0